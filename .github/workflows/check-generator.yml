name: Check TTS generator and splitter

on:
  push:
    branches: [main]
    paths:
      - "generate_audio.py"
      - "split_text.py"
      - "requirements.txt"
      - ".github/workflows/generate_audio.yml"
      - ".github/workflows/check-generator.yml"
  pull_request:
    paths:
      - "generate_audio.py"
      - "split_text.py"
      - "requirements.txt"
      - ".github/workflows/generate_audio.yml"
      - ".github/workflows/check-generator.yml"

permissions:
  contents: read

jobs:
  syntax-and-splitter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile generator and splitter
        run: python -m py_compile generate_audio.py split_text.py

      - name: Check voice/rate mapping and text chunking
        run: |
          python - <<'PY'
          import re
          import generate_audio
          from split_text import split_text

          assert generate_audio.rate_percent("1.0") == "+0%"
          assert generate_audio.rate_percent("1.25") == "+25%"
          assert generate_audio.rate_percent("0.75") == "-25%"
          for name in ("Nam Minh", "Hoài My"):
              assert name in generate_audio.VOICE_IDS

          try:
              generate_audio.rate_percent("3.0")
          except ValueError:
              pass
          else:
              raise AssertionError("Expected invalid rate to be rejected")

          source = ("Đây là một câu thử nghiệm để kiểm tra việc tự chia nhỏ. " * 80)
          source += "\n\nĐoạn kết phải vẫn nằm cuối văn bản."
          chunks = split_text(source, 800)
          assert len(chunks) > 1, "Long text should be split into multiple chunks."
          assert all(0 < len(chunk) <= 800 for chunk in chunks)
          normalize = lambda value: re.sub(r"\\s+", "", value)
          assert normalize(" ".join(chunks)) == normalize(source.strip()), (
              "The split text lost, duplicated, or reordered non-whitespace characters."
          )
          assert chunks[-1].endswith("văn bản."), "The final words must remain in the last chunk."
          print(f"Checks passed: voice/rate mapping and {len(chunks)} ordered chunks.")
          PY
