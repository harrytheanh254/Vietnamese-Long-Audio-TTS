name: Generate long audio
run-name: "SẢNH TRUYỆN ${{ inputs.request_id || github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "ID tác vụ do ứng dụng SẢNH TRUYỆN tạo"
        required: true
        type: string
      voice:
        description: "Giọng đọc"
        required: true
        type: choice
        options:
          - Nam Minh
          - Hoài My
      rate:
        description: "Tốc độ đọc"
        required: true
        type: choice
        default: "1.0"
        options:
          - "0.75"
          - "1.0"
          - "1.25"
          - "1.5"
          - "1.75"
          - "2.0"

permissions:
  contents: write

concurrency:
  group: story-audio-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  generate:
    name: Download, synthesize and merge story
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download temporary story upload
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          tag="st-request-${REQUEST_ID}"
          echo "Tìm truyện tạm theo request ID: ${REQUEST_ID}"
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")"
          asset_id="$(printf '%s' "$release_json" | jq -r '[.assets[]? | select(.name == "story.txt")][0].id // empty')"
          if [ -z "$asset_id" ]; then
            echo "::error::Release ${tag} không có asset story.txt."
            printf '%s' "$release_json" | jq -r '.assets[]? | .name' || true
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
            -H "Accept: application/octet-stream" > kichban.txt
          python - <<'PY'
          from pathlib import Path
          p = Path("kichban.txt")
          text = p.read_text(encoding="utf-8-sig")
          if not text.strip():
              raise SystemExit("Tệp truyện trống hoặc tải xuống không thành công.")
          print(f"Đã tải truyện: {len(text):,} ký tự.")
          PY

      - name: Split story into chunks
        run: |
          set -euo pipefail
          python split_text.py --input kichban.txt --output-dir chunks --target-chars 3000
          python - <<'PY'
          from pathlib import Path
          import re

          chunks = sorted(Path("chunks").glob("part_*.txt"))
          if not chunks:
              raise SystemExit("::error::Không tạo được phần văn bản nào.")
          indices = []
          for path in chunks:
              match = re.fullmatch(r"part_(\d+)\.txt", path.name)
              if not match:
                  raise SystemExit(f"Tên chunk không đúng quy ước: {path.name}")
              indices.append(int(match.group(1)))
              if not path.read_text(encoding="utf-8").strip():
                  raise SystemExit(f"Chunk văn bản rỗng: {path.name}")
          expected_indices = list(range(1, len(chunks) + 1))
          if indices != expected_indices:
              raise SystemExit(f"Chunk bị thiếu hoặc sai thứ tự: {indices[:10]}")
          Path("chunk_count.txt").write_text(str(len(chunks)))
          print(f"Đã xác nhận {len(chunks)} chunk theo đúng thứ tự: {chunks[0].name} → {chunks[-1].name}")
          PY

      - name: Install audio dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt imageio-ffmpeg==0.6.0

      - name: Generate MP3 parts in parallel (max 4)
        env:
          INPUT_VOICE: ${{ inputs.voice }}
          INPUT_RATE: ${{ inputs.rate }}
        run: |
          set -euo pipefail
          mkdir -p parts
          python - <<'PY'
          import os
          import subprocess
          import sys
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          import imageio_ffmpeg

          chunks = sorted(Path("chunks").glob("part_*.txt"))
          expected = int(Path("chunk_count.txt").read_text().strip())
          if not chunks or len(chunks) != expected:
              raise SystemExit(f"Invalid chunk count: found {len(chunks)}, expected {expected}.")

          voice = os.environ["INPUT_VOICE"]
          rate = os.environ["INPUT_RATE"]
          ffmpeg = imageio_ffmpeg.get_ffmpeg_exe()
          ffprobe = str(Path(ffmpeg).with_name(Path(ffmpeg).name.replace("ffmpeg", "ffprobe")))

          def validate_mp3(path):
              if not path.is_file() or path.stat().st_size < 128:
                  raise RuntimeError(f"MP3 missing or too small: {path}")
              # ffmpeg bundled by imageio-ffmpeg does not always ship ffprobe;
              # decode the stream to a null sink to detect truncated/corrupt media.
              check = subprocess.run(
                  [ffmpeg, "-hide_banner", "-v", "error", "-i", str(path),
                   "-f", "null", "-"],
                  capture_output=True, text=True
              )
              if check.returncode:
                  raise RuntimeError(f"MP3 decode check failed for {path}: {check.stderr[-1200:]}")
              return path

          def make_part(item):
              index, source = item
              output = Path("parts") / f"part_{source.stem.removeprefix('part_')}.mp3"
              print(f"[START] Part {index}/{len(chunks)}: {source.name}", flush=True)
              subprocess.run([
                  sys.executable, "generate_audio.py",
                  "--input", str(source),
                  "--output", str(output),
                  "--voice", voice,
                  "--rate", rate,
                  "--attempts", "3",
              ], check=True)
              validate_mp3(output)
              print(f"[VALID] {output.name} ({output.stat().st_size:,} bytes)", flush=True)
              return output

          failures = []
          with ThreadPoolExecutor(max_workers=4) as pool:
              futures = {
                  pool.submit(make_part, (i, chunk)): chunk
                  for i, chunk in enumerate(chunks, start=1)
              }
              for future in as_completed(futures):
                  try:
                      output = future.result()
                      print(f"[DONE] {output.name}", flush=True)
                  except Exception as exc:
                      failures.append((futures[future].name, str(exc)))
                      print(f"[ERROR] {futures[future].name}: {exc}", file=sys.stderr, flush=True)

          if failures:
              print(f"::error::{len(failures)} parts failed validation or synthesis; refusing to merge.", file=sys.stderr)
              raise SystemExit(1)

          outputs = sorted(Path("parts").glob("part_*.mp3"))
          if len(outputs) != expected:
              raise SystemExit(f"Missing MP3 files: found {len(outputs)}, expected {expected}.")
          print(f"Generated and validated all {len(outputs)} parts with up to 4 parallel workers.", flush=True)
          PY

      - name: Merge MP3 parts in numeric order
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path
          import imageio_ffmpeg

          def part_number(path):
              match = re.fullmatch(r"part_(\d+)\.mp3", path.name)
              if not match:
                  raise SystemExit(f"Tên file MP3 không hợp lệ: {path.name}")
              return int(match.group(1))

          parts = sorted(Path("parts").glob("part_*.mp3"), key=part_number)
          expected = int(Path("chunk_count.txt").read_text().strip())
          expected_numbers = list(range(1, expected + 1))
          actual_numbers = [part_number(p) for p in parts]
          if len(parts) != expected or actual_numbers != expected_numbers:
              raise SystemExit(
                  f"MP3 thiếu/trùng/sai thứ tự: tìm thấy {len(parts)}/{expected}; "
                  f"các số đầu: {actual_numbers[:12]}"
              )

          ffmpeg = imageio_ffmpeg.get_ffmpeg_exe()
          # Validate each segment again immediately before concat, then merge in numeric order.
          for part in parts:
              if not part.is_file() or part.stat().st_size < 128:
                  raise SystemExit(f"MP3 rỗng hoặc quá nhỏ: {part.name}")
              check = subprocess.run(
                  [ffmpeg, "-hide_banner", "-v", "error", "-i", str(part),
                   "-f", "null", "-"],
                  capture_output=True, text=True
              )
              if check.returncode:
                  raise SystemExit(f"MP3 lỗi {part.name}: {check.stderr[-1200:]}")

          manifest = Path("concat.txt")
          manifest.write_text(
              "".join(f"file '{p.resolve().as_posix()}'\n" for p in parts),
              encoding="utf-8",
          )
          subprocess.run([
              ffmpeg,
              "-hide_banner", "-loglevel", "error", "-y",
              "-f", "concat", "-safe", "0", "-i", str(manifest),
              "-vn", "-c:a", "libmp3lame", "-b:a", "48k",
              "-ar", "24000", "-ac", "1", "output.mp3",
          ], check=True)
          out = Path("output.mp3")
          if not out.is_file() or out.stat().st_size < 128:
              raise SystemExit("MP3 cuối cùng không hợp lệ.")
          final_check = subprocess.run(
              [ffmpeg, "-hide_banner", "-v", "error", "-i", str(out),
               "-f", "null", "-"],
              capture_output=True, text=True
          )
          if final_check.returncode:
              raise SystemExit(f"MP3 cuối cùng không giải mã được: {final_check.stderr[-1200:]}")
          print(f"Đã ghép {len(parts)} phần theo thứ tự số; kích thước {out.stat().st_size:,} bytes.")
          PY

      - name: Upload final MP3
        uses: actions/upload-artifact@v4
        with:
          name: AU ${{ github.run_number }}
          path: output.mp3
          if-no-files-found: error
          retention-days: 7

      - name: Delete temporary story upload
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -u
          tag="st-request-${REQUEST_ID}"
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq .id 2>/dev/null || true)"
          if [ -n "$release_id" ]; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}" || echo "::warning::Không xóa được release tạm."
          fi
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" 2>/dev/null || echo "Tag tạm không tồn tại hoặc đã được xóa."
