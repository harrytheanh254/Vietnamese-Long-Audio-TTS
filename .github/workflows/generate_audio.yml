name: Generate long audio
run-name: "SẢNH TRUYỆN ${{ inputs.request_id || github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "ID tác vụ do ứng dụng SẢNH TRUYỆN tạo"
        required: true
        type: string
      voice:
        description: "Giọng đọc"
        required: true
        type: choice
        options:
          - Nam Minh
          - Hoài My
      rate:
        description: "Tốc độ đọc"
        required: true
        type: choice
        default: "1.0"
        options:
          - "0.75"
          - "1.0"
          - "1.25"
          - "1.5"
          - "1.75"
          - "2.0"

permissions:
  contents: write

concurrency:
  group: story-audio-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  split:
    name: Split chapter into natural chunks
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      chunk_count: ${{ steps.matrix.outputs.chunk_count }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download temporary story upload
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          tag="st-request-${REQUEST_ID}"
          echo "Tìm truyện tạm theo request ID: ${REQUEST_ID}"
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")"
          asset_id="$(printf '%s' "$release_json" | jq -r '[.assets[]? | select(.name == "story.txt")][0].id // empty')"
          if [ -z "$asset_id" ]; then
            echo "::error::Release ${tag} không có asset story.txt."
            printf '%s' "$release_json" | jq -r '.assets[]? | .name' || true
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
            -H "Accept: application/octet-stream" > kichban.txt
          python - <<'PY'
          from pathlib import Path
          p = Path("kichban.txt")
          text = p.read_text(encoding="utf-8-sig")
          if not text.strip():
              raise SystemExit("Tệp truyện trống hoặc tải xuống không thành công.")
          print(f"Đã tải truyện: {len(text):,} ký tự.")
          PY

      - name: Split chapter into natural chunks
        run: |
          set -euo pipefail
          python split_text.py --input kichban.txt --output-dir chunks --target-chars 3000
          python - <<'PY'
          from pathlib import Path
          import re
          chunks = sorted(Path("chunks").glob("part_*.txt"))
          if not chunks:
              raise SystemExit("Không tạo được phần văn bản nào.")
          indices = []
          for path in chunks:
              m = re.fullmatch(r"part_(\d+)\.txt", path.name)
              if not m:
                  raise SystemExit(f"Tên chunk không đúng: {path.name}")
              indices.append(int(m.group(1)))
              if not path.read_text(encoding="utf-8").strip():
                  raise SystemExit(f"Chunk rỗng: {path.name}")
          if indices != list(range(1, len(chunks) + 1)):
              raise SystemExit(f"Chunk bị thiếu hoặc sai thứ tự: {indices[:12]}")
          print(f"Đã chia và xác nhận {len(chunks)} đoạn.")
          PY

      - name: Prepare matrix and publish chunks
        id: matrix
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          chunks = sorted(Path("chunks").glob("part_*.txt"))
          parts = [p.stem.removeprefix("part_") for p in chunks]
          print("matrix=" + json.dumps({"part": parts}, separators=(",", ":")))
          print(f"chunk_count={len(parts)}")
          PY
          cat "$GITHUB_OUTPUT"
      - name: Upload split text chunks
        uses: actions/upload-artifact@v4
        with:
          name: story-chunks
          path: chunks/part_*.txt
          if-no-files-found: error
          retention-days: 1

  synthesize:
    name: Synthesize part ${{ matrix.part }}
    needs: split
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.split.outputs.matrix) }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download this text chunk
        uses: actions/download-artifact@v4
        with:
          name: story-chunks
          path: chunks

      - name: Install audio dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt imageio-ffmpeg==0.6.0

      - name: Synthesize one MP3 part
        env:
          INPUT_VOICE: ${{ inputs.voice }}
          INPUT_RATE: ${{ inputs.rate }}
          PART_ID: ${{ matrix.part }}
        run: |
          set -euo pipefail
          input="chunks/part_${PART_ID}.txt"
          output="part_${PART_ID}.mp3"
          test -s "$input" || { echo "::error::Không tìm thấy chunk $input"; exit 1; }
          python generate_audio.py --input "$input" --output "$output" \
            --voice "$INPUT_VOICE" --rate "$INPUT_RATE" --attempts 3
          test -s "$output" || { echo "::error::MP3 đầu ra rỗng: $output"; exit 1; }
          ffmpeg_bin="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          "$ffmpeg_bin" -hide_banner -v error -i "$output" -f null -
          echo "Đã tạo và kiểm tra $output ($(stat -c '%s bytes' "$output"))."

      - name: Upload synthesized MP3 part
        uses: actions/upload-artifact@v4
        with:
          name: mp3-part-${{ matrix.part }}
          path: part_${{ matrix.part }}.mp3
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge parts into one MP3
    needs: [split, synthesize]
    runs-on: ubuntu-22.04
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install merge dependencies
        run: python -m pip install imageio-ffmpeg==0.6.0

      - name: Download all synthesized parts
        uses: actions/download-artifact@v4
        with:
          pattern: mp3-part-*
          path: parts
          merge-multiple: true

      - name: Merge parts in numeric order and validate
        env:
          EXPECTED_PARTS: ${{ needs.split.outputs.chunk_count }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import subprocess
          import os
          from pathlib import Path
          import imageio_ffmpeg

          def number(path):
              match = re.fullmatch(r"part_(\d+)\.mp3", path.name)
              if not match:
                  raise SystemExit(f"Tên file MP3 không hợp lệ: {path.name}")
              return int(match.group(1))

          parts = sorted(Path("parts").glob("part_*.mp3"), key=number)
          expected = int(os.environ["EXPECTED_PARTS"])
          actual = [number(p) for p in parts]
          if len(parts) != expected or actual != list(range(1, expected + 1)):
              raise SystemExit(f"Thiếu/trùng/sai thứ tự MP3: tìm thấy {len(parts)}/{expected}; số phần: {actual[:20]}")

          ffmpeg = imageio_ffmpeg.get_ffmpeg_exe()
          for part in parts:
              if not part.is_file() or part.stat().st_size < 128:
                  raise SystemExit(f"MP3 rỗng hoặc quá nhỏ: {part.name}")
              check = subprocess.run(
                  [ffmpeg, "-hide_banner", "-v", "error", "-i", str(part), "-f", "null", "-"],
                  capture_output=True, text=True
              )
              if check.returncode:
                  raise SystemExit(f"MP3 lỗi {part.name}: {check.stderr[-1200:]}")

          manifest = Path("concat.txt")
          manifest.write_text("".join(f"file '{p.resolve().as_posix()}'\n" for p in parts), encoding="utf-8")
          subprocess.run([
              ffmpeg, "-hide_banner", "-loglevel", "error", "-y",
              "-f", "concat", "-safe", "0", "-i", str(manifest),
              "-vn", "-c:a", "libmp3lame", "-b:a", "48k",
              "-ar", "24000", "-ac", "1", "output.mp3",
          ], check=True)
          out = Path("output.mp3")
          if not out.is_file() or out.stat().st_size < 128:
              raise SystemExit("MP3 cuối cùng không hợp lệ.")
          check = subprocess.run(
              [ffmpeg, "-hide_banner", "-v", "error", "-i", str(out), "-f", "null", "-"],
              capture_output=True, text=True
          )
          if check.returncode:
              raise SystemExit(f"MP3 cuối cùng không giải mã được: {check.stderr[-1200:]}")
          print(f"Đã ghép {len(parts)} phần theo thứ tự số; kích thước {out.stat().st_size:,} bytes.")
          PY

      - name: Upload final MP3
        uses: actions/upload-artifact@v4
        with:
          name: AU ${{ github.run_number }}
          path: output.mp3
          if-no-files-found: error
          retention-days: 7

  cleanup:
    name: Delete temporary story upload
    needs: [split, synthesize, merge]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Delete temporary story release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -u
          tag="st-request-${REQUEST_ID}"
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq .id 2>/dev/null || true)"
          if [ -n "$release_id" ]; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}" || echo "::warning::Không xóa được release tạm."
          fi
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" 2>/dev/null || echo "Tag tạm không tồn tại hoặc đã được xóa."
