name: Generate long audio
run-name: "SẢNH TRUYỆN ${{ inputs.request_id || github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "ID tác vụ do ứng dụng SẢNH TRUYỆN tạo"
        required: false
        type: string
      content_gzip_base64:
        description: "Nội dung TXT đã nén gzip và mã hóa base64"
        required: true
        type: string
      voice:
        description: "Giọng đọc"
        required: true
        type: choice
        options:
          - Nam Minh
          - Hoài My
      rate:
        description: "Tốc độ đọc"
        required: true
        type: choice
        default: "1.0"
        options:
          - "0.75"
          - "1.0"
          - "1.25"
          - "1.5"
          - "1.75"
          - "2.0"

permissions:
  contents: read

jobs:
  prepare:
    name: Split chapter into natural chunks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.split.outputs.matrix }}
      chunk_count: ${{ steps.split.outputs.count }}
    steps:
      - name: Ensure this repository is private
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$REPOSITORY_PRIVATE" != "true" ]; then
            echo "::error::Refusing to process story text because this repository is not private."
            exit 1
          fi

      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decode story text in the runner
        env:
          CONTENT_GZIP_BASE64: ${{ inputs.content_gzip_base64 }}
        run: |
          python - <<'PY'
          import base64
          import gzip
          import os
          from pathlib import Path

          encoded = os.environ.get("CONTENT_GZIP_BASE64", "")
          if not encoded:
              raise SystemExit("Thiếu nội dung truyện trong dữ liệu workflow.")
          try:
              packed = base64.b64decode(encoded, validate=True)
              text = gzip.decompress(packed).decode("utf-8")
          except Exception as exc:
              raise SystemExit(f"Không giải mã được nội dung truyện: {exc}") from exc
          if not text.strip():
              raise SystemExit("Nội dung truyện trống.")
          Path("kichban.txt").write_text(text, encoding="utf-8")
          print(f"Đã nhận nội dung truyện ({len(text):,} ký tự). Không in nội dung ra log.")
          PY

      - name: Split chapter at paragraph and sentence boundaries
        id: split
        run: |
          python split_text.py --input kichban.txt --output-dir chunks --target-chars 3000 --github-output "$GITHUB_OUTPUT"

      - name: Upload temporary text chunks
        uses: actions/upload-artifact@v4
        with:
          name: tts-text-chunks
          path: chunks/part_*.txt
          if-no-files-found: error
          retention-days: 1

  synthesize:
    name: "Synthesize part ${{ matrix.index }}"
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Ensure this repository is private
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$REPOSITORY_PRIVATE" != "true" ]; then
            echo "::error::Refusing to process story text because this repository is not private."
            exit 1
          fi

      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install audio dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download prepared text chunks
        uses: actions/download-artifact@v4
        with:
          name: tts-text-chunks
          path: chunks

      - name: Generate MP3 part
        env:
          INPUT_VOICE: ${{ inputs.voice }}
          INPUT_RATE: ${{ inputs.rate }}
        run: |
          python generate_audio.py --input "chunks/${{ matrix.file }}" --output "part_${{ matrix.index }}.mp3" --voice "$INPUT_VOICE" --rate "$INPUT_RATE" --attempts 2

      - name: Upload MP3 part
        uses: actions/upload-artifact@v4
        with:
          name: tts-audio-part-${{ matrix.index }}
          path: part_${{ matrix.index }}.mp3
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge parts into one MP3
    needs:
      - prepare
      - synthesize
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Ensure this repository is private
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$REPOSITORY_PRIVATE" != "true" ]; then
            echo "::error::Refusing to process story text because this repository is not private."
            exit 1
          fi

      - name: Download all generated parts
        uses: actions/download-artifact@v4
        with:
          pattern: tts-audio-part-*
          path: parts
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Join MP3 parts in the original order
        env:
          EXPECTED_PARTS: ${{ needs.prepare.outputs.chunk_count }}
        run: |
          python -m pip install imageio-ffmpeg==0.6.0
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          import imageio_ffmpeg

          parts = sorted(Path("parts").glob("part_*.mp3"))
          expected = int(os.environ["EXPECTED_PARTS"])
          if len(parts) != expected:
              raise SystemExit(
                  f"Thiếu audio phân đoạn: nhận {len(parts)}, cần {expected}."
              )
          if not parts:
              raise SystemExit("Không tìm thấy MP3 phân đoạn để ghép.")

          manifest = Path("concat.txt")
          manifest.write_text(
              "".join(f"file '{part.resolve().as_posix()}'\n" for part in parts),
              encoding="utf-8",
          )
          ffmpeg = imageio_ffmpeg.get_ffmpeg_exe()
          command = [
              ffmpeg, "-hide_banner", "-loglevel", "error", "-y",
              "-f", "concat", "-safe", "0", "-i", str(manifest),
              "-vn", "-c:a", "libmp3lame", "-b:a", "48k",
              "-ar", "24000", "-ac", "1", "output.mp3",
          ]
          subprocess.run(command, check=True)
          output = Path("output.mp3")
          if not output.is_file() or output.stat().st_size < 128:
              raise SystemExit("File MP3 cuối cùng không hợp lệ.")
          print(
              f"Đã ghép {len(parts)} phần thành một MP3 "
              f"({output.stat().st_size:,} bytes)."
          )
          PY

      - name: Upload final MP3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: AU ${{ github.run_number }}
          path: output.mp3
          if-no-files-found: error
          retention-days: 7
