name: Generate Vietnamese audiobook

on:
  workflow_dispatch:
    inputs:
      text:
        description: "Nội dung truyện (tối đa 60.000 ký tự)"
        required: true
        type: string
      voice:
        description: "Giọng đọc"
        required: true
        type: choice
        options:
          - Nam Minh
          - Hoài My
        default: Nam Minh
      rate:
        description: "Tốc độ đọc (0.5–2.0)"
        required: true
        default: "1.0"
        type: string

permissions:
  contents: read

concurrency:
  group: audiobook-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate audio (4 segments concurrently)
        env:
          STORY_TEXT: ${{ inputs.text }}
          STORY_VOICE: ${{ inputs.voice }}
          STORY_RATE: ${{ inputs.rate }}
        run: python run_workflow.py
      - name: Upload final MP3
        uses: actions/upload-artifact@v4
        with:
          name: audiobook-${{ github.run_id }}
          path: output/audiobook.mp3
          if-no-files-found: error
          retention-days: 3
