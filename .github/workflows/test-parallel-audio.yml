name: Parallel audio end-to-end test
run-name: "Parallel TTS test · ${{ github.ref_name }}"

on:
  push:
    branches:
      - "test/parallel-audio-e2e"
    paths:
      - ".github/workflows/test-parallel-audio.yml"
      - "generate_audio.py"
      - "split_text.py"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare synthetic sample and split it
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.split.outputs.matrix }}
      chunk_count: ${{ steps.split.outputs.count }}
    steps:
      - name: Confirm private repository
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$REPOSITORY_PRIVATE" != "true" ]; then
            echo "::error::This test must run only in a private repository."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create synthetic, non-private sample text
        run: |
          python - <<'PY'
          from pathlib import Path
          paragraph = (
              "Đây là đoạn văn mẫu để thử quy trình tạo audio tự động. "
              "Người lữ khách dừng chân bên hiên nhà, lắng nghe tiếng gió "
              "đi qua hàng cây rồi tiếp tục bước trên con đường vắng. "
          )
          text = "\n\n".join([paragraph * 3 for _ in range(6)])
          Path("smoke-test.txt").write_text(text, encoding="utf-8")
          print(f"Prepared synthetic sample: {len(text)} characters.")
          PY

      - name: Split sample at natural text boundaries
        id: split
        run: |
          python split_text.py --input smoke-test.txt --output-dir chunks --target-chars 700 --github-output "$GITHUB_OUTPUT"

      - name: Upload text chunks for parallel jobs
        uses: actions/upload-artifact@v4
        with:
          name: test-tts-text-chunks
          path: chunks/part_*.txt
          if-no-files-found: error
          retention-days: 1

  synthesize:
    name: "Synthesize sample part ${{ matrix.index }}"
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Confirm private repository
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$REPOSITORY_PRIVATE" != "true" ]; then
            echo "::error::This test must run only in a private repository."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Edge-TTS
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download text chunks
        uses: actions/download-artifact@v4
        with:
          name: test-tts-text-chunks
          path: chunks

      - name: Generate one MP3 part
        env:
          TEST_VOICE: "Nam Minh"
          TEST_RATE: "1.0"
        run: |
          python generate_audio.py --input "chunks/${{ matrix.file }}" --output "part_${{ matrix.index }}.mp3" --voice "$TEST_VOICE" --rate "$TEST_RATE" --attempts 2

      - name: Upload generated MP3 part
        uses: actions/upload-artifact@v4
        with:
          name: test-tts-audio-part-${{ matrix.index }}
          path: part_${{ matrix.index }}.mp3
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Verify merge into one MP3
    needs:
      - prepare
      - synthesize
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Confirm private repository
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$REPOSITORY_PRIVATE" != "true" ]; then
            echo "::error::This test must run only in a private repository."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download all generated MP3 parts
        uses: actions/download-artifact@v4
        with:
          pattern: test-tts-audio-part-*
          path: parts
          merge-multiple: true

      - name: Install FFmpeg helper
        run: python -m pip install imageio-ffmpeg

      - name: Merge parts in original order and validate output
        env:
          EXPECTED_PARTS: ${{ needs.prepare.outputs.chunk_count }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          import imageio_ffmpeg

          parts = sorted(Path("parts").glob("part_*.mp3"))
          expected = int(os.environ["EXPECTED_PARTS"])
          if len(parts) != expected:
              raise SystemExit(f"Expected {expected} MP3 parts; found {len(parts)}.")
          if not parts or any(not part.is_file() or part.stat().st_size < 128 for part in parts):
              raise SystemExit("A generated MP3 part is missing or empty.")

          manifest = Path("concat.txt")
          manifest.write_text(
              "".join(f"file '{part.resolve().as_posix()}'\n" for part in parts),
              encoding="utf-8",
          )
          ffmpeg = imageio_ffmpeg.get_ffmpeg_exe()
          subprocess.run([
              ffmpeg, "-hide_banner", "-loglevel", "error", "-y",
              "-f", "concat", "-safe", "0", "-i", str(manifest),
              "-vn", "-c:a", "libmp3lame", "-b:a", "48k",
              "-ar", "24000", "-ac", "1", "parallel-smoke-test.mp3",
          ], check=True)

          output = Path("parallel-smoke-test.mp3")
          if not output.is_file() or output.stat().st_size < 128:
              raise SystemExit("Merged MP3 is missing or too small.")
          subprocess.run([
              ffmpeg, "-hide_banner", "-loglevel", "error",
              "-i", str(output), "-f", "null", "-"
          ], check=True)
          print(f"PASS: {len(parts)} parts were merged into one valid MP3 ({output.stat().st_size} bytes).")
          PY

      - name: Upload the single merged test MP3
        uses: actions/upload-artifact@v4
        with:
          name: parallel-audio-smoke-test
          path: parallel-smoke-test.mp3
          if-no-files-found: error
          retention-days: 1
